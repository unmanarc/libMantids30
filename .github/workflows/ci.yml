name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu 24.04", image: "ubuntu:24.04", family: "debian" }
          - { name: "Ubuntu 26.04", image: "ubuntu:26.04", family: "debian" }
          - { name: "Debian 12", image: "debian:12", family: "debian" }
          - { name: "Debian 13", image: "debian:13", family: "debian" }
          - { name: "RHEL 8", image: "almalinux:8", family: "rhel", cmake_args: "-DBoost_DIR=/usr/lib64/cmake/Boost-1.78.0" }
          - { name: "RHEL 9", image: "almalinux:9", family: "rhel", cmake_args: "-DBoost_DIR=/usr/lib64/cmake/Boost-1.78.0" }
          - { name: "RHEL 10", image: "almalinux:10", family: "rhel" }
    steps:
      - name: Bootstrap git
        run: |
          set -eux
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates
          else
            dnf install -y git ca-certificates
          fi

      - uses: actions/checkout@v7

      - name: Install dependencies (Debian/Ubuntu)
        if: matrix.family == 'debian'
        run: |
          set -eux
          apt-get update
          if [ "${{ matrix.image }}" = "debian:12" ]; then
            # Bookworm provides Boost.JSON through the versioned Boost 1.81 packages.
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential cmake pkg-config libssl-dev \
              libboost1.81-dev libboost-regex1.81-dev libboost-thread1.81-dev \
              libboost-system1.81-dev libboost-json1.81-dev
          else
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential cmake pkg-config \
              libboost-dev libboost-regex-dev libboost-thread-dev libboost-system-dev \
              libssl-dev libboost-json-dev
          fi
          # Optional database backends: their modules are skipped when absent.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libsqlite3-dev libpq-dev libmariadb-dev || true

      - name: Install dependencies (RHEL family)
        if: matrix.family == 'rhel'
        run: |
          set -eux
          dnf install -y dnf-plugins-core
          if [ "${{ matrix.name }}" = "RHEL 8" ]; then
            dnf config-manager --set-enabled powertools
          else
            dnf config-manager --set-enabled crb
          fi
          dnf install -y epel-release
          dnf makecache --refresh
          dnf repolist --enabled
          dnf install -y gcc-c++ make cmake pkgconf-pkg-config \
            openssl-devel
          # RHEL 8/9 use EPEL's versioned Boost package and its CMake config.
          # RHEL 10 uses the native development and JSON runtime packages.
          if [ "${{ matrix.name }}" = "RHEL 8" ]; then
            dnf --enablerepo=epel,powertools install -y boost1.78-devel
            rpm -q boost1.78-devel
            test -f /usr/include/boost1.78/boost/json.hpp
            test -f /usr/lib64/cmake/Boost-1.78.0/BoostConfig.cmake
          elif [ "${{ matrix.name }}" = "RHEL 9" ]; then
            dnf --enablerepo=epel,crb install -y boost1.78-devel
            rpm -q boost1.78-devel
            test -f /usr/include/boost1.78/boost/json.hpp
            test -f /usr/lib64/cmake/Boost-1.78.0/BoostConfig.cmake
          else
            dnf --enablerepo=crb install -y boost-devel boost-json
            rpm -q boost-devel boost-json
            test -f /usr/include/boost/json.hpp
          fi
          dnf install -y sqlite-devel libpq-devel mariadb-connector-c-devel || true

      - name: Configure
        run: >
          cmake -S . -B build-shared
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_INSTALL_PREFIX="$PWD/stage"
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build-shared --parallel "$(nproc)"

      - name: Install and smoke test
        run: |
          set -eux
          cmake --install build-shared
          test -f stage/include/Mantids30/Core/Helpers/random.h
          test -f stage/include/Mantids30/Protocol/HTTP/httpv1_server.h
          export PKG_CONFIG_PATH="$PWD/stage/share/pkgconfig"
          pkg-config --exists Mantids30_Core_Helpers
          pkg-config --exists Mantids30_Protocol_HTTP
          pkg-config --modversion Mantids30_Core_Helpers

  build-static:
    name: Build (static, Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libboost-dev libboost-regex-dev libboost-thread-dev libboost-system-dev \
            libssl-dev libboost-json-dev

      - name: Configure, build and install (static)
        run: |
          set -eux
          cmake -S . -B build-static -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/stage-static"
          cmake --build build-static --parallel "$(nproc)"
          cmake --install build-static
          test -f stage-static/lib/libMantids30_Core_Helpers.a
