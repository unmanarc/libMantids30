name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu 22.04", image: "ubuntu:22.04", family: "debian" }
          - { name: "Ubuntu 24.04", image: "ubuntu:24.04", family: "debian" }
          - { name: "Ubuntu 26.04", image: "ubuntu:26.04", family: "debian" }
          - { name: "Debian 12", image: "debian:12", family: "debian" }
          - { name: "Debian 13", image: "debian:13", family: "debian" }
          - { name: "AlmaLinux 8 (RHEL 8)", image: "almalinux:8", family: "rhel" }
          - { name: "AlmaLinux 9 (RHEL 9)", image: "almalinux:9", family: "rhel" }
          - { name: "AlmaLinux 10 (RHEL 10)", image: "almalinux:10", family: "rhel" }
    steps:
      - name: Bootstrap git
        run: |
          set -eux
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates
          else
            dnf install -y git ca-certificates
          fi

      - uses: actions/checkout@v7

      - name: Install dependencies (Debian/Ubuntu)
        if: matrix.family == 'debian'
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libboost-dev libboost-regex-dev libboost-thread-dev libboost-system-dev \
            libssl-dev libboost-json-dev
          # Optional database backends: their modules are skipped when absent.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libsqlite3-dev libpq-dev libmariadb-dev || true

      - name: Install dependencies (RHEL family)
        if: matrix.family == 'rhel'
        run: |
          set -eux
          dnf install -y dnf-plugins-core || true
          if [ "${{ matrix.name }}" = "AlmaLinux 8 (RHEL 8)" ]; then
            dnf config-manager --set-enabled powertools || true
          else
            dnf config-manager --set-enabled crb || true
          fi
          dnf install -y epel-release || true
          dnf install -y gcc-c++ make cmake pkgconf-pkg-config \
            boost-devel openssl-devel boost-json-devel
          dnf install -y sqlite-devel libpq-devel mariadb-connector-c-devel || true

      - name: Configure
        run: >
          cmake -S . -B build-shared
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_INSTALL_PREFIX="$PWD/stage"

      - name: Build
        run: cmake --build build-shared --parallel "$(nproc)"

      - name: Install and smoke test
        run: |
          set -eux
          cmake --install build-shared
          test -f stage/include/Mantids30/Helpers/random.h
          test -f stage/include/Mantids30/Protocol_HTTP/httpv1_server.h
          export PKG_CONFIG_PATH="$PWD/stage/share/pkgconfig"
          pkg-config --exists Mantids30_Helpers
          pkg-config --exists Mantids30_Protocol_HTTP
          pkg-config --modversion Mantids30_Helpers

  build-static:
    name: Build (static, Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libboost-dev libboost-regex-dev libboost-thread-dev libboost-system-dev \
            libssl-dev libboost-json-dev

      - name: Configure, build and install (static)
        run: |
          set -eux
          cmake -S . -B build-static -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/stage-static"
          cmake --build build-static --parallel "$(nproc)"
          cmake --install build-static
          test -f stage-static/lib/libMantids30_Helpers.a
